<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Citra</title>
    <link rel="stylesheet" href="LPC.css" />
  </head>
  <body>
    <!-- Container Form-->
    <div class="login-container">
      <div class="login-header">
        <h2>Admin Citra</h2>
      </div>

      <form action="/login-endpoint" method="POST">
        <div class="form-group">
          <label>User</label>
          <input type="text" placeholder="Silahkan Masukkan User" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Silahkan Masukkan Password"
            required
            autocomplete="current-password"
          />
        </div>

        <button
          type="button"
          class="login-btn"
          onclick="window.location.href = '../Admin_Dashboard/Dashboard.html'"
        >
          Sign In
        </button>

        <p class="footer-text">
          &copy; Laboratorium Pengembangan Pengolahan Citra
        </p>
      </form>
    </div>
  </body>
</html>
